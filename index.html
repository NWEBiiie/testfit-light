<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>TestFit Light</title><meta name="description" content="A straight-sided architectural test-fit editor with boundary alignment, shared walls, groups, doors and curtains."><link rel="stylesheet" href="styles.css?v=clean-room-numbers-69"></head>
<body>
  <header><div class="brand"><span class="brand-mark" aria-hidden="true">⌑</span><div><h1>TestFit <strong>Light</strong></h1></div></div><div class="header-actions"><button id="undo" title="Undo (Ctrl+Z)">Undo</button><button id="redo" title="Redo (Ctrl+Shift+Z)">Redo</button><span class="divider"></span><button id="save">Save</button><button id="open">Open</button><button id="export" title="Wall centerlines + door leaves and swing arcs · no fills or reference outlines · full-size feet">SVG</button><button id="exportCsv" title="Room program: net hatch areas and feet/inches A × B dimensions">CSV</button><button id="exportDxf" title="Editable wall-centerline curves · 1 CAD unit = 1 foot">DXF</button><button id="blank">New blank</button><button id="sample" title="Default layout">Default</button><input id="file" type="file" accept=".json" hidden></div></header>
  <main>
    <aside class="left" id="roomsPanel">
      <section><h2>Create a room</h2><form id="createForm"><label>Name<input id="newName" value="EXAM ROOM" maxlength="48" required></label><div class="two"><label>Width · ft<input id="newWidth" type="number" min="2" max="500" step="0.25" value="10" required></label><label>Depth · ft<input id="newDepth" type="number" min="2" max="500" step="0.25" value="12" required></label></div><div><label>Grid · degrees<input id="newAngle" type="number" min="-180" max="180" step="1" value="0"></label></div><button class="primary wide" type="submit">＋ Add room <span id="newArea">120 sf</span></button></form></section>
      <section><h2>Room numbers</h2><label>Start number<input id="numberStart" value="101" maxlength="32" placeholder="A-101"></label><button id="renumberRooms" class="wide">Renumber · click rooms</button><div class="selection-tools"><label class="check"><input id="multi" type="checkbox"> Multi-select</label><button id="clearSelection" class="text-button">Clear</button></div></section>
      <section><h2>Drawing</h2><label>Wall appearance<select id="wallStyle"><option value="black">Solid black</option><option value="poche" selected>White poché · black outline</option><option value="hatch">Hatched poché · black outline</option></select></label><label>New walls · in<input id="defaultThickness" type="number" min="1" max="36" step="0.5" value="6"></label><label>Exterior walls · in<input id="exteriorThickness" type="number" min="1" max="36" step="0.5" value="12"></label><label class="check"><input id="boundarySnap" type="checkbox" checked> Boundary snap</label><label class="check"><input id="roomSnap" type="checkbox" checked> Wall / corridor snap</label><label>Snap distance · ft<input id="snapDistance" type="number" min="0.1" max="10" step="0.25" value="2"></label></section>
    </aside>
    <section class="workspace" id="canvasPanel" aria-label="Plan drawing">
      <div class="toolbar"><div class="boundary-buttons"><button id="addDoor" class="primary" type="button">＋ Add door</button><button id="siteRect">Site rectangle</button><button id="sitePoly">Site polyline</button><button id="finish" hidden>Finish boundary</button><button id="undoPoint" hidden>Undo point</button><button id="cancel" hidden>Cancel</button></div></div>
      <div class="drawing" id="drawing"><svg id="plan" role="img" aria-label="Interactive architectural floor plan" tabindex="0"></svg><div id="isolationBar" class="isolation-bar" hidden><span id="isolationName"></span><button id="exitIsolation" type="button">Exit isolation</button></div><div id="pathDrawingBar" class="path-drawing-bar" hidden><span id="pathDrawingHint">90° corners · click end, then stop.</span><button id="stopDrawing" class="primary" type="button">■ Stop drawing</button></div><div class="canvas-badge">PLAN <span>FEET / INCHES</span></div><div id="clientPalette" class="client-palette" role="group" aria-label="Client room colors"></div><div class="zoom"><button id="zoomOut" aria-label="Zoom out">−</button><input id="zoom" type="range" min="0.5" max="35" step="0.25" value="10" aria-label="Drawing zoom"><output id="zoomValue">100%</output><button id="zoomIn" aria-label="Zoom in">＋</button><button id="fit">Fit</button></div><div class="scale"><span id="scaleBar"></span><label>10 ft</label></div></div>
      <footer><p id="status" role="status">Ready.</p><output id="wallCount"></output></footer>
    </section>
    <aside class="right" id="propertiesPanel"><div class="inspector-heading"><h2 id="inspectorTitle">EXAM ROOM</h2></div><div id="inspector"></div><section class="corridor-section"><div class="section-heading"><h2>Corridor paths</h2></div><label>New path width · ft<input id="corridorWidth" type="number" min="1" max="100" step="0.25" value="8"></label><label>Path direction<select id="corridorDirection"><option value="ortho" selected>Orthogonal · 90° corners</option><option value="free">Free angle</option></select></label><button id="drawCorridor" class="primary wide">＋ Draw corridor path</button><button id="resumeDrawing" class="wide" type="button" hidden>Resume unfinished path</button><button id="discardDraft" class="text-button" type="button" hidden>Discard unfinished path</button><div id="corridorList" class="side-list"></div></section><section class="boundary-list-section"><div class="section-heading"><h2>Boundaries</h2><span id="boundaryCount"></span></div><div id="boundaryList"></div><div id="exclusionControls"></div><details><summary>Import / edit boundary</summary><input id="svgFile" type="file" accept=".svg,.json,image/svg+xml,application/json" hidden><button id="svgChoose" class="wide" type="button">Choose SVG or JSON file</button><p id="svgNotice" class="hint"></p><label>Outline<select id="svgOutline"></select></label><label>Actual overall width · ft<input id="svgWidth" type="number" min="0.01" max="10000" step="any" value="177"></label><div class="two"><label>Left X · ft<input id="svgX" type="number" step="any" value="0"></label><label>Top Y · ft<input id="svgY" type="number" step="any" value="0"></label></div><label>Apply as<select id="svgMode"><option value="study">Separate boundary-only study</option><option value="replace">Replace boundary · keep rooms in place</option></select></label><div id="svgPreview"></div><button id="svgApply" class="primary wide" type="button" disabled>Apply boundary</button></details><p id="projectNote" class="notice warning" hidden></p></section></aside>
  </main>
  <nav class="mobile-nav"><a href="#canvasPanel">Plan</a><a href="#roomsPanel">Rooms</a><a href="#propertiesPanel">Properties</a></nav>
  <script src="geometry.js?v=clean-room-numbers-69"></script><script src="edit-tools.js?v=clean-room-numbers-69"></script><script src="hosted-doors.js?v=clean-room-numbers-69"></script><script src="cad-export.js?v=clean-room-numbers-69"></script><script src="default-project.js?v=clean-room-numbers-69"></script><script src="september-studies.js?v=clean-room-numbers-69"></script><script src="app.js?v=clean-room-numbers-69"></script>
</body></html>
